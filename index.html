<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ПУЛЬС Связь — Защищённые звонки P2P</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#0B141B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ПУЛЬС Связь">
  <meta name="description" content="Постоянные зашифрованные комнаты для видеозвонков P2P. Без цензуры и регистрации.">
  
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0D14;
      --bg-surface: #121622;
      --bg-card: #181D2B;
      --bg-card-hover: #1E2436;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #8B5CF6;
      
      --brand-primary: #7C3AED;
      --brand-primary-hover: #6D28D9;
      --brand-pink: #EC4899;
      
      --pulse-green: #22C55E;
      --pulse-green-dark: #16A34A;
      
      --hazard-amber: #F59E0B;
      --alert-red: #EF4444;
      
      --text-white: #FFFFFF;
      --text-main: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ШАПКА В СТИЛЕ ПРИЛОЖЕНИЯ */
    header {
      background: #0D111A;
      border-bottom: 1px solid var(--border-subtle);
      padding-top: max(14px, calc(10px + env(safe-area-inset-top, 0px)));
      padding-bottom: 14px;
      padding-left: max(16px, calc(16px + env(safe-area-inset-left, 0px)));
      padding-right: max(16px, calc(16px + env(safe-area-inset-right, 0px)));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-sizing: border-box;
    }

    @media all and (display-mode: standalone) {
      header {
        padding-top: max(50px, calc(14px + env(safe-area-inset-top, 44px)));
      }
    }

    .is-standalone-pwa header {
      padding-top: max(50px, calc(14px + env(safe-area-inset-top, 44px)));
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .brand-badge-tag {
      background: rgba(236, 72, 153, 0.16);
      color: #F472B6;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.2px;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-install-header {
      background: #1E2436;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-install-header:hover {
      background: #252D42;
    }
    .btn-install-header:active {
      transform: scale(0.96);
    }

    /* ОСНОВНОЙ КОНТЕЙНЕР (PRE-JOIN) */
    #prejoin-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 40px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
      gap: 20px;
    }

    /* КАРТОЧКА ГЛАВНОГО ВХОДА */
    .hero-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 20px 18px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero-title-group h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: -0.2px;
    }

    /* ПОЛЕ ВВОДА КОМНАТЫ */
    .input-field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .app-input {
      width: 100%;
      height: 48px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 0 42px 0 42px;
      color: var(--text-white);
      font-family: var(--font-mono);
      font-size: 14.5px;
      font-weight: 600;
      outline: none;
      transition: all 0.15s;
    }

    .app-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .input-clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ГЛАВНАЯ КНОПКА ЗВОНКА */
    .btn-primary-call {
      height: 48px;
      background: var(--brand-primary);
      border: none;
      border-radius: 12px;
      color: #FFF;
      font-family: var(--font-main);
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary-call:hover {
      background: var(--brand-primary-hover);
    }

    .btn-primary-call:active {
      transform: scale(0.98);
    }

    /* СЕКЦИЯ ПОСТОЯННЫХ КОМНАТ */
    .rooms-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-create-room-small {
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: #C4B5FD;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-create-room-small:hover {
      background: rgba(124, 58, 237, 0.22);
    }

    .rooms-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .room-card-app {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .room-card-app:hover {
      background: var(--bg-card);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .room-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .room-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #1E2436;
      color: #E2E8F0;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .room-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .room-name-text {
      font-size: 14px;
      font-weight: 600;
      color: #FFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-code-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      background: #181D2B;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 5px;
      align-self: flex-start;
    }

    .room-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-room-call {
      background: var(--pulse-green-dark);
      color: #FFF;
      border: none;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-room-call:hover {
      background: #15803D;
    }
    .btn-room-call:active {
      transform: scale(0.96);
    }

    .btn-room-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-room-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    .btn-room-delete {
      color: #94A3B8;
    }
    .btn-room-delete:hover, .btn-room-delete:active {
      color: #EF4444;
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .rooms-empty-card {
      background: rgba(18, 22, 34, 0.6);
      border: 1px dashed var(--border-subtle);
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .empty-icon {
      font-size: 24px;
      opacity: 0.6;
    }
    .empty-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-white);
    }
    .empty-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.4;
      max-width: 270px;
    }

    /* ЭКРАН АКТИВНОГО ЗВОНКА (CALL VIEW) */
    #call-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: #000;
      display: none;
      flex-direction: column;
    }

    #call-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      z-index: 1;
    }

    /* ПЛАВАЮЩИЙ ХЕДЕР В ЗВОНКЕ */
    .call-floating-top {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 0;
      right: 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }

    .call-status-pill {
      pointer-events: auto;
      background: rgba(11, 20, 27, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #FFF;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pulse-green);
      box-shadow: 0 0 8px var(--pulse-green);
      animation: dot-pulse 1.8s infinite;
    }
    @keyframes dot-pulse {
      0% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.6; transform: scale(0.9); }
    }

    .call-top-btn {
      pointer-events: auto;
      background: rgba(11, 20, 27, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFF;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* НИЖНИЙ ПУЛЬТ В СТИЛЕ TELEGRAM */
    .call-bottom-dock {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 16px;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      max-width: 96vw;
    }

    .dock-circle-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #FFF;
      font-size: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    @media (max-width: 440px) {
      .call-bottom-dock {
        gap: 8px;
        padding: 8px 12px;
      }
      .dock-circle-btn {
        width: 44px;
        height: 44px;
        font-size: 19px;
      }
    }

    .dock-circle-btn:active {
      transform: scale(0.92);
    }

    .dock-circle-btn.active {
      background: var(--pulse-green-dark);
      color: #FFF;
      box-shadow: 0 0 14px var(--pulse-green-glow);
    }

    .dock-circle-btn.danger {
      background: var(--alert-red);
      color: #FFF;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }


    /* МОДАЛЬНОЕ ОКНО СОЗДАНИЯ КОМНАТЫ */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFF;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-modal-cancel {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-modal-confirm {
      background: var(--pulse-blue);
      border: none;
      color: #FFF;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ТОСТ ОПОВЕЩЕНИЙ */
    #toast-msg {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
      left: 50%;
      transform: translateX(-50%);
      background: #0284C7;
      color: #FFF;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 24px;
    /* ОПОВЕЩЕНИЕ О РАЗРЕШЕНИИ ЗВОНКОВ В ФОНЕ */
    .perm-banner {
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .perm-banner:hover {
      background: rgba(124, 58, 237, 0.18);
    }
    .perm-icon {
      font-size: 22px;
      flex-shrink: 0;
    }
    .perm-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }
    .perm-text strong {
      font-size: 13px;
      font-weight: 700;
      color: #FFF;
    }
    .perm-text span {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .perm-btn {
      background: #7C3AED;
      color: #FFF;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* АКТИВНЫЙ ВЫЗОВ В СПИСКЕ КОМНАТ */
    .room-card-app.has-active-call {
      border-color: rgba(16, 185, 129, 0.5) !important;
      background: rgba(16, 185, 129, 0.08) !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.18);
    }
    .room-card-app.has-active-call .btn-room-call {
      background: #10B981 !important;
      animation: roomBtnPulse 1.6s infinite ease-in-out;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
    }
    @keyframes roomBtnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .badge-live-call {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 700;
      color: #34D399;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 1px 7px;
      border-radius: 5px;
      margin-top: 3px;
      width: fit-content;
    }
    .badge-live-call .pulse-green-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: dotPulse 1.2s infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ПОЛНОЭКРАННЫЙ ЭКРАН ВХОДЯЩЕГО ЗВОНКА (CALL MODAL) */
    .incoming-call-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeInModal 0.25s ease-out;
    }
    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .incoming-call-card {
      background: #121622;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 34px 26px 28px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;

    .incoming-avatar-wrap {

    @keyframes incomingPulseRing {

    .incoming-info-block {

  <!-- ПОЛНОЭКРАННЫЙ ЭКРАН ВХОДЯЩЕГО ВЫЗОВА (CALL OVERLAY) -->

  <div id="toast-msg">Ссылка скопирована!</div>

  <!-- MQTT БИБЛИОТЕКА СИГНАЛИНГА (ЛОКАЛЬНАЯ + CDN РЕЗЕРВ) -->
  <script src="mqtt.min.js"></script>
  <script>
    if (typeof mqtt === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';
      document.head.appendChild(s);
    }
  </script>

  <script>
    // --- 0. СИСТЕМА ОПОВЕЩЕНИЙ И ВХОДЯЩИХ ЗВОНКОВ (DESKTOP & PWA CALLS) ---
    const myClientId = (function() {
      let id = sessionStorage.getItem('pulse_client_id');
      if (!id) {
        id = 'pc_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36).slice(-4);
        sessionStorage.setItem('pulse_client_id', id);
      }
      return id;
    })();

    // Синтезатор рингтона (Web Audio API — мгновенный чистый звук без внешних mp3)
    class RingtonePlayer {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
      }
      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch(e){}
      }
      play() {
        if (this.isPlaying) return;
        this.init();
        this.isPlaying = true;

        const playPattern = () => {
          if (!this.isPlaying) return;
          try {
            if (!this.ctx) this.init();
            if (this.ctx) {
              const now = this.ctx.currentTime;
              this._playBeep(now, 0.38, 440, 554.37);
              this._playBeep(now + 0.48, 0.38, 480, 587.33);
            }
          } catch(e){}

          this.timer = setTimeout(() => {
            if (this.isPlaying) playPattern();
          }, 2400);
        };

        playPattern();
      }
      _playBeep(t0, dur, f1, f2) {
        if (!this.ctx) return;
        try {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(f1, t0);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(f2, t0);

          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(0.32, t0 + 0.05);
          gain.gain.setValueAtTime(0.28, t0 + dur - 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(t0);
          osc2.start(t0);
          osc1.stop(t0 + dur);
          osc2.stop(t0 + dur);
        } catch(e){}
      }
      stop() {
        this.isPlaying = false;
        if (this.timer) {
          clearTimeout(this.timer);
          this.timer = null;
        }
      }
    }
    const ringtone = new RingtonePlayer();
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, () => ringtone.init(), { passive: true });
    });

    // Состояние комнат и входящих звонков
    let activeCallsMap = {};       // safeRoomId -> callData
    let currentIncomingCall = null;
    let declinedSessions = {};      // sessionId -> timestamp
    let titleFlashingTimer = null;
    const originalPageTitle = document.title || 'ПУЛЬС Связь';
    let callerHeartbeatTimer = null;
    let currentCallSessionId = null;

    // Синхронизация между вкладками браузера (BroadcastChannel)
    let callBroadcastChannel = null;
    try {
      callBroadcastChannel = new BroadcastChannel('pulse_calls_sync');
      callBroadcastChannel.onmessage = (event) => {
        if (!event.data) return;
        if (event.data.action === 'accepted' || event.data.action === 'declined') {
          dismissIncomingCall();
        }
      };
    } catch(e){}

    // Мигание заголовка страницы во время входящего звонка
    function startTitleFlashing(alertText) {
      stopTitleFlashing();
      let toggle = false;
      titleFlashingTimer = setInterval(() => {
        document.title = toggle ? alertText : originalPageTitle;
        toggle = !toggle;
      }, 900);
    }
    function stopTitleFlashing() {
      if (titleFlashingTimer) {
        clearInterval(titleFlashingTimer);
        titleFlashingTimer = null;
      }
      document.title = originalPageTitle;
    }

    // Проверка разрешений системных уведомлений для фоновых звонков
    function checkCallNotificationPermission() {
      const banner = document.getElementById('call-perm-banner');
      if (!banner) return;
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          banner.style.display = 'flex';
        } else {
          banner.style.display = 'none';
        }
      } else {
        banner.style.display = 'none';
      }
    }
    function requestCallNotificationPermission() {
      ringtone.init();
      if ('Notification' in window) {
        Notification.requestPermission().then(() => {
          checkCallNotificationPermission();
          showToast('Оповещения о звонках настроены');
        });
      }
    }

    // Показ системного уведомления на рабочем столе (даже если браузер свернут)
    function showCallDesktopNotification(callData) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const title = `📞 Входящий вызов: ${callData.roomName || callData.roomCode}`;
        const options = {
          body: 'В комнате начался защищенный звонок. Нажмите, чтобы ответить.',
          icon: './apple-touch-icon.png',
          badge: './favicon.png',
          tag: 'pulse_call_' + callData.safeRoomId,
          renotify: true,
          requireInteraction: true,
          data: { roomCode: callData.roomCode, sessionId: callData.sessionId }
        };
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => reg.showNotification(title, options).catch(() => {}));
        } else {
          const notif = new Notification(title, options);
          notif.onclick = () => {
            window.focus();
            acceptIncomingCall();
            notif.close();
          };
        }
      } catch(e){}
    }

    // Отображение диалога входящего вызова
    function triggerIncomingCall(callData) {
      if (currentIncomingCall && currentIncomingCall.sessionId === callData.sessionId) {
        return;
      }
      currentIncomingCall = callData;

      const modal = document.getElementById('modal-incoming-call');
      const titleEl = document.getElementById('incoming-room-title');
      const avatarChar = document.getElementById('incoming-avatar-char');
      const displayName = callData.roomName || callData.roomCode;

      if (titleEl) titleEl.textContent = displayName.toUpperCase();
      if (avatarChar) avatarChar.textContent = displayName.charAt(0).toUpperCase();
      if (modal) modal.style.display = 'flex';

      ringtone.play();

      if ('vibrate' in navigator) {
        try { navigator.vibrate([400, 250, 400, 250, 600]); } catch(e){}
      }

      startTitleFlashing('📞 ЗВОНОК: ' + displayName);
      showCallDesktopNotification(callData);
    }

    function dismissIncomingCall() {
      const modal = document.getElementById('modal-incoming-call');
      if (modal) modal.style.display = 'none';
      ringtone.stop();
      stopTitleFlashing();
      currentIncomingCall = null;
    }

    function acceptIncomingCall() {
      if (!currentIncomingCall) return;
      const code = currentIncomingCall.roomCode;
      const sessId = currentIncomingCall.sessionId;
      dismissIncomingCall();

      if (callBroadcastChannel) {
        try { callBroadcastChannel.postMessage({ action: 'accepted', sessionId: sessId }); } catch(e){}
      }
      quickJoin(code);
    }

    function declineIncomingCall() {
      if (!currentIncomingCall) return;
      const sessId = currentIncomingCall.sessionId;
      declinedSessions[sessId] = Date.now();
      dismissIncomingCall();

      if (callBroadcastChannel) {
        try { callBroadcastChannel.postMessage({ action: 'declined', sessionId: sessId }); } catch(e){}
      }
    }

    // MQTT Сигналинг (EMQX / HiveMQ с автоматическим переключением)
    const MQTT_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];
    let currentBrokerIdx = 0;
    let mqttClient = null;

    function initMqttSignaling() {
      if (typeof mqtt === 'undefined') {
        setTimeout(initMqttSignaling, 600);
        return;
      }
      const brokerUrl = MQTT_BROKERS[currentBrokerIdx];
      try {
        mqttClient = mqtt.connect(brokerUrl, {
          clientId: myClientId,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 4000
        });

        mqttClient.on('connect', () => {
          mqttClient.subscribe('pulse/v1/rooms/+/call', { qos: 0 });
        });

        mqttClient.on('message', (topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            handleIncomingSignalingMessage(msg);
          } catch(e){}
        });

        mqttClient.on('error', () => {
          currentBrokerIdx = (currentBrokerIdx + 1) % MQTT_BROKERS.length;
        });
      } catch(e){}
    }

    function handleIncomingSignalingMessage(msg) {
      if (!msg || !msg.safeRoomId) return;
      const safeId = msg.safeRoomId;
      const savedRooms = getSavedRooms();
      const matchedSaved = savedRooms.find(r => toSafeRoomId(r.code) === safeId || (r.code && r.code.toUpperCase() === (msg.roomCode || '').toUpperCase()));

      if (msg.action === 'ringing') {
        activeCallsMap[safeId] = {
          roomCode: msg.roomCode,
          roomName: (matchedSaved && matchedSaved.name) || msg.roomName || msg.roomCode,
          sessionId: msg.sessionId,
          callerId: msg.callerId,
          timestamp: msg.timestamp || Date.now(),
          receivedAt: Date.now()
        };
        renderRoomsList();

        // Если звонящий — НЕ этот клиент, и комната есть у нас в постоянных
        if (matchedSaved && msg.callerId !== myClientId) {
          const inCall = document.getElementById('call-view').style.display === 'flex';
          if (inCall) return;

          if (declinedSessions[msg.sessionId] && (Date.now() - declinedSessions[msg.sessionId] < 60000)) {
            return;
          }
          triggerIncomingCall(activeCallsMap[safeId]);
        }
      } else if (msg.action === 'hangup') {
        delete activeCallsMap[safeId];
        renderRoomsList();

        if (currentIncomingCall && currentIncomingCall.sessionId === msg.sessionId) {
          dismissIncomingCall();
        }
      }
    }

    function publishCallEvent(action, roomCode, safeRoomId, sessionId) {
      if (!mqttClient || !mqttClient.connected) return;
      const topic = `pulse/v1/rooms/${safeRoomId}/call`;
      const payload = JSON.stringify({
        action: action,
        roomCode: roomCode,
        safeRoomId: safeRoomId,
        callerId: myClientId,
        sessionId: sessionId,
        timestamp: Date.now()
      });
      try {
        mqttClient.publish(topic, payload, { qos: 0 });
      } catch(e){}
    }

    // Автоочистка завершённых вызовов
    setInterval(() => {
      const now = Date.now();
      let changed = false;
      for (const safeId in activeCallsMap) {
        if (now - activeCallsMap[safeId].receivedAt > 8500) {
          delete activeCallsMap[safeId];
          changed = true;
          if (currentIncomingCall && currentIncomingCall.safeRoomId === safeId) {
            dismissIncomingCall();
          }
        }
      }
      if (changed) renderRoomsList();
    }, 2500);

    // --- 1. РЕГИСТРАЦИЯ SERVICE WORKER (PWA) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.action === 'answer_call') {
          dismissIncomingCall();
          if (event.data.roomCode) {
            quickJoin(event.data.roomCode);
          }
        }
      });
    }

    // --- 2. ОБНАРУЖЕНИЕ PWA И ДИАЛОГ УСТАНОВКИ НА РАБОЧИЙ СТОЛ ---
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const pwaBanner = document.getElementById('pwa-install-banner');
    const headerInstallBtn = document.getElementById('btn-header-install');
    const bannerText = document.getElementById('pwa-banner-text');
    const bannerCta = document.getElementById('btn-pwa-action-cta');

    if (!isStandalone) {
      if (isIos) {
        // iOS Safari инструкция
        if (bannerText) bannerText.innerHTML = '<strong>Добавить на экран iPhone:</strong> Нажмите «Поделиться» ⎋ и «На экран „Домой“» ➕';
        if (bannerCta) bannerCta.textContent = 'Инструкция';
        if (pwaBanner) pwaBanner.style.display = 'flex';
        if (headerInstallBtn) headerInstallBtn.style.display = 'inline-flex';
      } else {
        // Android Chrome
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          if (pwaBanner) pwaBanner.style.display = 'flex';
          if (headerInstallBtn) headerInstallBtn.style.display = 'inline-flex';
        });
      }
    }

    function triggerPwaInstall() {
      if (isIos) {
        alert('Как установить на iPhone:\n1. Нажмите иконку «Поделиться» ⎋ внизу браузера Safari.\n2. Прокрутите вниз и выберите «На экран „Домой“» ➕.\n\nИконка ПУЛЬС появится прямо на вашем рабочем столе!');
      } else if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          if (pwaBanner) pwaBanner.style.display = 'none';
          if (headerInstallBtn) headerInstallBtn.style.display = 'none';
        });
      } else {
        alert('Для установки приложения нажмите в меню браузера (три точки) ➔ «Установить приложение» или «Добавить на главный экран».');
      }
    }

    function dismissPwaBanner() {
      if (pwaBanner) pwaBanner.style.display = 'none';
    }

    // --- 3. ХРАНЕНИЕ ПОСТОЯННЫХ КОМНАТ (LOCALSTORAGE) ---
    const STORAGE_KEY = 'pulse_saved_rooms_v3';

    function getSavedRooms() {
      try {
        // Миграция и очистка старой демо-комнаты SEMIA1042
        ['pulse_saved_rooms_v2', 'pulse_saved_rooms'].forEach(k => {
          const old = localStorage.getItem(k);
          if (old) {
            try {
              const parsed = JSON.parse(old);
              if (Array.isArray(parsed)) {
                const cleaned = parsed.filter(r => r && r.code !== 'SEMIA1042' && r.id !== 'PulseSemia1042');
                if (cleaned.length > 0 && !localStorage.getItem(STORAGE_KEY)) {
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned));
                }
              }
            } catch(e){}
            localStorage.removeItem(k);
          }
        });

        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw !== null) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            return parsed.filter(r => r && r.code !== 'SEMIA1042' && r.id !== 'PulseSemia1042');
          }
        }
      } catch(e){}
      return [];
    }

    function saveRooms(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch(e){}
      renderRoomsList();
    }

    function renderRoomsList() {
      const list = getSavedRooms();
      const container = document.getElementById('rooms-list-container');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="rooms-empty-card">
            <div class="empty-icon">🛋️</div>
            <div class="empty-title">Список комнат пуст</div>
            <div class="empty-sub">Вы можете создать постоянную комнату кнопкой выше или войти по любому коду.</div>
          </div>
        `;
        return;
      }

      list.forEach((r, idx) => {
        const card = document.createElement('div');
        const safeId = toSafeRoomId(r.code);
        const callInfo = activeCallsMap[safeId];
        const hasCall = callInfo && (callInfo.callerId !== myClientId);

        card.className = 'room-card-app' + (hasCall ? ' has-active-call' : '');
        
        const letter = (r.name || 'К').charAt(0).toUpperCase();
        card.innerHTML = `
          <div class="room-left-group" onclick="quickJoin('${escapeHtml(r.code)}')">
            <div class="room-avatar">${letter}</div>
            <div class="room-info">
              <span class="room-name-text">${escapeHtml(r.name)}</span>
              <span class="room-code-badge">КОД: ${escapeHtml(r.code)}</span>
              ${hasCall ? '<span class="badge-live-call"><span class="pulse-green-dot"></span> Идёт звонок</span>' : ''}
            </div>
          </div>
          <div class="room-actions">
            <button class="btn-room-call" onclick="quickJoin('${escapeHtml(r.code)}')">
              <span>📞</span> ${hasCall ? 'Ответить' : 'Звонок'}
            </button>
            <button class="btn-room-icon" title="Поделиться" onclick="event.stopPropagation(); shareRoomLink('${escapeHtml(r.code)}', '${escapeHtml(r.name)}')">
              📲
            </button>
            <button class="btn-room-icon btn-room-delete" title="Удалить комнату" onclick="event.stopPropagation(); deleteRoom(${idx})">
              🗑️
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openCreateModal() {
      document.getElementById('modal-create-room').style.display = 'flex';
      document.getElementById('new-room-name-input').focus();
    }

    function closeCreateModal() {
      document.getElementById('modal-create-room').style.display = 'none';
      document.getElementById('new-room-name-input').value = '';
    }

    function saveNewRoom() {
      const name = document.getElementById('new-room-name-input').value.trim() || 'Комната';
      const num = Math.floor(1000 + Math.random() * 9000);
      const slug = translit(name).replace(/[^a-zA-Z0-9]/g, '').slice(0, 10) || 'Room';
      const code = (slug + num).toUpperCase();
      const id = 'Pulse' + code;

      const list = getSavedRooms();
      list.unshift({ id, name, code });
      saveRooms(list);
      closeCreateModal();
      showToast('Комната сохранена!');

      // Запрашиваем разрешение на системные уведомления для фоновых звонков
      if ('Notification' in window && Notification.permission === 'default') {
        requestCallNotificationPermission();
      }
    }

    function deleteRoom(idx) {
      const list = getSavedRooms();
      if (idx >= 0 && idx < list.length) {
        const removed = list.splice(idx, 1);
        saveRooms(list);
        showToast('Комната удалена');
      }
    }

    function quickJoin(code) {
      inputField.value = code;
      handleJoinSubmit();
    }

    function shareRoomLink(code, name) {
      const canonical = toSafeRoomId(code);
      const url = `${window.location.origin}${window.location.pathname}?room=${canonical}&name=${encodeURIComponent(name)}`;
      const text = `📞 Защищённый звонок в «ПУЛЬС Связь»\nКомната: ${name}\nКод: ${code}\nСсылка: ${url}`;
      
      if (navigator.share) {
        navigator.share({ title: 'ПУЛЬС Связь', text: text, url: url }).catch(() => {
          copyToClipboard(url);
        });
      } else {
        copyToClipboard(url);
      }
    }

    function copyToClipboard(str) {
      navigator.clipboard.writeText(str).then(() => {
        showToast('Ссылка скопирована!');
      }).catch(() => {
        showToast(str);
      });
    }

    // --- 4. НОРМАЛИЗАЦИЯ И ПОДКЛЮЧЕНИЕ К WEBRTC ---
    const urlParams = new URLSearchParams(window.location.search);
    const initialRoom = urlParams.get('room') || urlParams.get('name') || '';
    const inputField = document.getElementById('room-input-field');

    if (initialRoom) {
      inputField.value = initialRoom;
    }

    function translit(text) {
      const cyr = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z',
        'и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r',
        'с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch',
        'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
      };
      let s = (text || '').toLowerCase();
      let r = '';
      for (let ch of s) {
        r += cyr[ch] !== undefined ? cyr[ch] : ch;
      }
      return r;
    }

    function toSafeRoomId(text) {
      let clean = translit(text).replace(/[^a-zA-Z0-9]/g, '');
      if (clean.startsWith('pulse_')) clean = clean.substring(6);
      else if (clean.startsWith('pulse')) clean = clean.substring(5);
      return 'pulse_' + (clean || 'call');
    }

    function clearRoomInput() {
      inputField.value = '';
      inputField.focus();
    }

    function buildNinjaUrl(cleanRoom, withVideo) {
      // &push — уникальный ID стрима гарантирует автоматический старт без экранов выбора устройств ("Join Room with Camera")
      // &videodevice=1, &audiodevice=1 — моментальный захват камеры и микрофона
      // &clean — чистый полноэкранный интерфейс без посторонних элементов
      // &beepvolume=0 — полное отключение зуммеров и гудков
      // &relay — гарантированное прохождение NAT и мобильных операторов РФ
      const myStreamId = 'pulse_web_' + Math.random().toString(36).substring(2, 9);
      let base = `https://vdo.ninja/?room=${cleanRoom}&push=${myStreamId}&label=Web&autostart&darkmode&clean&webcam&videodevice=1&audiodevice=1&mesh&relay&aec&agc&denoise&beepvolume=0`;
      if (!withVideo) {
        base += '&videomute';
      }
      return base;
    }

    // --- 5. УПРАВЛЕНИЕ АКТИВНЫМ ВЫЗОВОМ ---
    let activeCleanRoom = 'pulse_call';
    let isCamActive = true;
    let isMicActive = true;
    let isSpeakerActive = true;
    let currentCamIndex = 0;
    let callTimerSeconds = 0;
    let callInterval = null;

    function startTimer() {
      callTimerSeconds = 0;
      if (callInterval) clearInterval(callInterval);
      callInterval = setInterval(() => {
        callTimerSeconds++;
        const mins = String(Math.floor(callTimerSeconds / 60)).padStart(2, '0');
        const secs = String(callTimerSeconds % 60).padStart(2, '0');
        document.getElementById('call-duration').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function handleJoinSubmit() {
      const raw = inputField.value.trim() || 'PulseCall';
      activeCleanRoom = toSafeRoomId(raw);
      const prefEl = document.getElementById('camera-pref-checkbox');
      const withVideo = prefEl ? prefEl.checked : true;
      isCamActive = withVideo;

      document.getElementById('call-room-label').textContent = raw.toUpperCase();

      document.getElementById('prejoin-view').style.display = 'none';
      document.getElementById('call-view').style.display = 'flex';

      const btnCam = document.getElementById('btn-cam-toggle');
      btnCam.classList.toggle('active', isCamActive);
      btnCam.textContent = isCamActive ? '📹' : '📷';

      // Публикуем событие начала звонка для оповещения всех участников
      currentCallSessionId = 'cs_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
      publishCallEvent('ringing', raw, activeCleanRoom, currentCallSessionId);

      if (callerHeartbeatTimer) clearInterval(callerHeartbeatTimer);
      callerHeartbeatTimer = setInterval(() => {
        publishCallEvent('ringing', raw, activeCleanRoom, currentCallSessionId);
      }, 3000);

      const finalUrl = buildNinjaUrl(activeCleanRoom, withVideo);
      document.getElementById('call-frame').src = finalUrl;
      startTimer();
    }

    function flipCam() {
      currentCamIndex = (currentCamIndex + 1) % 2;
      const frame = document.getElementById('call-frame');
      try {
        frame.contentWindow.postMessage({ changeVideoDevice: currentCamIndex }, '*');
        frame.contentWindow.postMessage({ action: 'changeVideoDevice', value: currentCamIndex }, '*');
      } catch(e){}
      showToast(currentCamIndex === 0 ? 'Задняя камера' : 'Фронтальная камера');
    }

    function toggleSpeaker() {
      isSpeakerActive = !isSpeakerActive;
      const frame = document.getElementById('call-frame');
      try {
        frame.contentWindow.postMessage({ action: 'speaker', value: isSpeakerActive }, '*');
        frame.contentWindow.postMessage({ action: 'volume', value: isSpeakerActive ? 100 : 0 }, '*');
        frame.contentWindow.postMessage({ volume: isSpeakerActive ? 100 : 0 }, '*');
      } catch(e){}

      const btn = document.getElementById('btn-speaker-toggle');
      if (btn) {
        btn.textContent = isSpeakerActive ? '🔊' : '🔇';
        btn.classList.toggle('active', isSpeakerActive);
        btn.classList.toggle('danger', !isSpeakerActive);
        btn.title = isSpeakerActive ? 'Выключить динамик' : 'Включить динамик';
      }
      showToast(isSpeakerActive ? 'Динамик включен' : 'Динамик выключен (Без звука)');
    }

    function toggleMic() {
      isMicActive = !isMicActive;
      const frame = document.getElementById('call-frame');
      try {
        frame.contentWindow.postMessage({ mic: isMicActive }, '*');
        frame.contentWindow.postMessage({ action: 'mic', value: isMicActive }, '*');
      } catch(e){}
      const btn = document.getElementById('btn-mic-toggle');
      btn.textContent = isMicActive ? '🎙️' : '🔇';
      btn.classList.toggle('active', isMicActive);
    }

    function toggleCam() {
      isCamActive = !isCamActive;
      const frame = document.getElementById('call-frame');
      try {
        frame.contentWindow.postMessage({ camera: isCamActive }, '*');
        frame.contentWindow.postMessage({ action: 'camera', value: isCamActive }, '*');
      } catch(e){}
      const btn = document.getElementById('btn-cam-toggle');
      btn.textContent = isCamActive ? '📹' : '📷';
      btn.classList.toggle('active', isCamActive);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function hangupCall() {
      if (callInterval) clearInterval(callInterval);
      if (callerHeartbeatTimer) {
        clearInterval(callerHeartbeatTimer);
        callerHeartbeatTimer = null;
      }
      if (currentCallSessionId && activeCleanRoom) {
        publishCallEvent('hangup', inputField.value.trim() || activeCleanRoom, activeCleanRoom, currentCallSessionId);
      }
      currentCallSessionId = null;

      document.getElementById('call-frame').src = 'about:blank';
      document.getElementById('call-view').style.display = 'none';
      document.getElementById('prejoin-view').style.display = 'flex';
      renderRoomsList();
    }

    window.addEventListener('beforeunload', () => {
      if (callerHeartbeatTimer && activeCleanRoom && currentCallSessionId) {
        publishCallEvent('hangup', inputField.value.trim() || activeCleanRoom, activeCleanRoom, currentCallSessionId);
      }
    });

    function copyInviteLink() {
      const raw = inputField.value.trim() || activeCleanRoom;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(raw)}`;
      copyToClipboard(inviteUrl);
    }

    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      toast.textContent = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Инициализация интерфейса и сигналинга
    renderRoomsList();
    checkCallNotificationPermission();
    initMqttSignaling();

    // Автостарт при ?autostart=1 или ?auto=1
    if ((urlParams.get('autostart') === '1' || urlParams.get('auto') === '1') && initialRoom) {
      setTimeout(() => handleJoinSubmit(), 350);
    }
  </script>
