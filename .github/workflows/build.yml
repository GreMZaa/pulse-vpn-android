name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Keystore
      run: |
        if [ -f "pulse_release.jks" ]; then
          echo "Using repository committed release keystore..."
          echo "KEYSTORE_PATH=$(pwd)/pulse_release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=pulsevpn123" >> $GITHUB_ENV
          echo "KEY_ALIAS=pulsevpn" >> $GITHUB_ENV
          echo "KEY_PASS=pulsevpn123" >> $GITHUB_ENV
        elif [ -n "${{ secrets.APP_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.APP_KEYSTORE_BASE64 }}" | base64 -d > android_keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/android_keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=${{ secrets.APP_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.APP_KEYSTORE_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.APP_KEY_PASSWORD }}" >> $GITHUB_ENV
        else
          echo "Creating self-signed keystore for release build..."
          keytool -genkeypair -v -keystore pulse_release.jks -alias pulsevpn -keyalg RSA -keysize 2048 -validity 10000 -storepass pulsevpn123 -keypass pulsevpn123 -dname "CN=PulseVPN, OU=Pulse, O=Pulse, L=City, S=State, C=US"
          echo "KEYSTORE_PATH=$(pwd)/pulse_release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=pulsevpn123" >> $GITHUB_ENV
          echo "KEY_ALIAS=pulsevpn" >> $GITHUB_ENV
          echo "KEY_PASS=pulsevpn123" >> $GITHUB_ENV
        fi

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport || true
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${KEYSTORE_PATH} \
          -Pandroid.injected.signing.store.password=${KEYSTORE_PASS} \
          -Pandroid.injected.signing.key.alias=${KEY_ALIAS} \
          -Pandroid.injected.signing.key.password=${KEY_PASS}

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: PulseVPN-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: PulseVPN-armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*armeabi-v7a*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: PulseVPN-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*universal*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/master'
      with:
        tag_name: v2.3.13-pulse
        name: "ПУЛЬС v2.3.13"
        body: |
          Официальный релиз приложения **ПУЛЬС // ВПН** для Android.
          - Быстрое подключение и защищенный трафик (V2Ray / Xray)
          - Встроенная автоматическая активация по промокоду
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
