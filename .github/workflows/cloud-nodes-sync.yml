name: Pulse Cloud 24/7 Auto-Collector (Every 20m)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-alive-whitelist-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xray-core for Real Tunnel & Telegram Verification
        run: |
          mkdir -p scripts/bin
          curl -sSL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -q -o /tmp/xray.zip -d scripts/bin
          chmod +x scripts/bin/xray

      - name: Fetch 15+ Whitelist Sources, Verify Real Xray Tunnels & Sync to Hugging Face Cloud
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/cloud_nodes_auto_sync.py
