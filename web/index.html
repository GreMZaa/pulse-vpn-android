<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ПУЛЬС // СВЯЗЬ — Защищённые звонки</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #07080A;
      --bg-card: #12141A;
      --border-edge: #222836;
      --text-main: #F0F4F8;
      --text-muted: #8E9BAE;
      --accent-green: #00E676;
      --accent-red: #FF3D57;
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-mono); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-void); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ШАПКА */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-edge);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo-box { display: flex; align-items: center; gap: 10px; }
    .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0.5; transform: scale(0.9); } }
    .brand-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: #FFF; }
    .room-badge { background: #1C222E; border: 1px solid var(--border-edge); padding: 4px 10px; border-radius: 6px; font-size: 11px; color: var(--accent-green); font-weight: 700; }

    /* ЭКРАН ВХОДА */
    #prejoin-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
      max-width: 440px;
      margin: 0 auto;
    }
    .call-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #182C1F;
      border: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.25);
    }
    .room-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #FFF; margin-top: 8px; }
    .room-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .btn-join {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .btn-green { background: var(--accent-green); color: #07080A; }
    .btn-green:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-outline { background: #181D26; color: #FFF; border: 1px solid var(--border-edge); margin-top: -6px; }
    .btn-outline:hover { background: #222936; }

    .tip-box {
      background: rgba(255, 179, 0, 0.1);
      border: 1px solid rgba(255, 179, 0, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      color: #FFD54F;
      text-align: left;
      line-height: 1.4;
      display: none;
    }

    /* КОНТЕЙНЕР ЗВОНКА */
    #call-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: none;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-void);
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header>
    <div class="logo-box">
      <div class="pulse-dot"></div>
      <div class="brand-title">ПУЛЬС // СВЯЗЬ</div>
    </div>
    <div class="room-badge" id="header-room-code">КОМНАТА</div>
  </header>

  <!-- ЭКРАН ВХОДА (ПРЕДОТВРАЩАЕТ ЧЁРНЫЙ ПУСТОЙ ЭКРАН) -->
  <div id="prejoin-screen">
    <div class="call-avatar">📞</div>
    <div class="room-title" id="room-name-display">Защищённая комната</div>
    <div class="room-desc">Сквозное шифрование WebRTC Opus. Разговор идёт напрямую без прослушки и блокировок ТСПУ.</div>

    <div class="tip-box" id="telegram-tip">
      💡 <strong>Совет для Telegram:</strong> Если в браузере Telegram нет звука, нажмите значок <strong>•••</strong> в правом верхнем углу и выберите <strong>«Открыть в Safari / Chrome»</strong>.
    </div>

    <button class="btn-join btn-green" id="btn-audio-join" onclick="startCall(false)">
      <span>📞</span> Присоединиться к звонку
    </button>

    <button class="btn-join btn-outline" id="btn-video-join" onclick="startCall(true)">
      <span>📹</span> Войти с видеокамерой
    </button>
  </div>

  <!-- ОКНО ЗВОНКА (WebRTC ВИДЕО И АУДИО) -->
  <div id="call-container">
    <iframe id="call-frame" allow="camera; microphone; autoplay; display-capture" allowfullscreen></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawRoom = params.get('room') || 'PulseCall';
    // Очищаем от дефисов и спецсимволов для 100% совместимости
    const cleanRoom = rawRoom.replace(/[^a-zA-Z0-9]/g, '') || 'PulseCall';
    const roomName = params.get('name') || cleanRoom;

    document.getElementById('room-name-display').textContent = roomName;
    document.getElementById('header-room-code').textContent = cleanRoom.toUpperCase();

    // Определение браузера внутри Telegram / WhatsApp на iOS
    const ua = navigator.userAgent || '';
    const isTelegram = /Telegram/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    if (isTelegram || (isIOS && !window.navigator.standalone)) {
      document.getElementById('telegram-tip').style.display = 'block';
    }

    function startCall(withVideo) {
      document.getElementById('prejoin-screen').style.display = 'none';
      const container = document.getElementById('call-container');
      container.style.display = 'block';

      // Уникальный ID стрима для веб-участника (БЕЗ этого VDO.Ninja зависает на экране выбора "Join Room with Microphone")
      const webPushId = 'pulse_web_' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 900 + 100);

      // &room + &push + &autostart мгновенно подключает микрофон в комнату и начинает вещание
      let ninjaUrl = `https://vdo.ninja/?room=${cleanRoom}&push=${webPushId}&autostart&darkmode`;
      if (!withVideo) {
        ninjaUrl += '&videodevice=0'; // стартует со звуком, камеру можно включить в любой момент
      }

      document.getElementById('call-frame').src = ninjaUrl;
    }

    // Если передан флаг автозапуска из приложения
    if (params.get('autostart') === '1') {
      startCall(params.get('video') === '1');
    }
  </script>
</body>
</html>
